/* Themes: Fresh (default, light), Ocean, Berry, Clay, Night. Chosen in setup and in Me → Look. */
:root{

}
:root[data-skin="ocean"]{ --paper:#F4F7FA; --soft:#ECF1F6; --line:#D9E1E9; --basil:#1F5F8B; --basil-soft:#E2EDF6; --basil-deep:#164A6E; --map:#ECF0F4; --lift:0 1px 2px rgba(27,36,32,.05),0 12px 32px rgba(31,95,139,.14) }
:root[data-skin="berry"]{ --paper:#F8F6FA; --soft:#F0EDF4; --line:#E2DCE9; --basil:#7A4FA0; --basil-soft:#EEE6F6; --basil-deep:#5C3A7B; --map:#F1EFF3; --lift:0 1px 2px rgba(27,36,32,.05),0 12px 32px rgba(122,79,160,.14) }
:root[data-skin="clay"]{ --paper:#FAF7F4; --soft:#F3EEE9; --line:#E6DDD5; --basil:#A84B25; --basil-soft:#F8E6DC; --basil-deep:#82391B; --map:#F2EEE9; --lift:0 1px 2px rgba(27,36,32,.05),0 12px 32px rgba(168,75,37,.14) }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--basil)}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 130px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:50%;background:var(--basil);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--basil-ink);opacity:.9}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.wk{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.35}
.wk b{color:var(--ink);font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--basil)}

.section{margin-top:20px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px}
.h2{font-size:19px;font-weight:700}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.btn.big{padding:14px 22px;font-size:16px;width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--basil-soft);border-color:var(--basil);color:var(--basil)}
.chip.sm{padding:5px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--basil-soft);color:var(--basil);white-space:nowrap}
.pill.warn{background:var(--citrus-soft);color:var(--citrus)}
.pill.bad{background:var(--tomato-soft);color:var(--tomato)}
.pill.plain{background:var(--soft);color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;background:var(--citrus-soft);font-size:14px}
.note.err{background:var(--tomato-soft)}
.note.ok{background:var(--basil-soft)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;flex:none}
.check svg{width:16px;height:16px}
.check[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.check.sm{width:24px;height:24px}
.check.sm svg{width:13px;height:13px}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{border-color:var(--line);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}

/* Day chips */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:1 0 44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:var(--ink);position:relative}
.dchip span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dchip b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.dchip i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--citrus-bar)}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dchip[aria-pressed="true"] span{color:var(--paper);opacity:.75}

/* Today: next up + score */
.next{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:14px 16px}
.next .eyebrow{color:var(--paper);opacity:.7}
.next h2{font-size:19px;margin-top:2px;line-height:1.25}
.next p{margin:3px 0 0;font-size:13px;opacity:.82}
.next .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;text-align:center}
.quick button svg{width:20px;height:20px;color:var(--basil)}
.dash{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:11.5px;color:var(--muted);margin-top:2px}
.bars{display:grid;gap:9px;min-width:0}
.bar-row{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar-row .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.bar-row .v small{font-weight:500;color:var(--muted)}
.track{height:8px;border-radius:8px;background:var(--soft);position:relative;overflow:hidden}
.track .plan{position:absolute;inset:0 auto 0 0;background:var(--line);border-radius:8px}
.track .got{position:absolute;inset:0 auto 0 0;background:var(--basil);border-radius:8px}
.track .got.low{background:var(--citrus-bar)}

/* Timeline */
.tl{display:grid;gap:0;position:relative}
.ti{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;position:relative;padding-bottom:10px}
.ti .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ti.past .t{opacity:.6}
.ti .box{min-width:0}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 8px 11px 12px}
.meal.done{opacity:.7}
.meal.done h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.meal-main{min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0;color:inherit}
.meal-main h3{font-size:16.5px;font-weight:600;line-height:1.25;margin-top:1px}
.meal-main .meta{font-size:12.5px;color:var(--muted);margin:3px 0 0;font-variant-numeric:tabular-nums}
.slot{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--basil)}
.slot.out{color:var(--citrus)}
.lo{font-size:12px;font-weight:600;color:var(--citrus);margin-top:3px}
.task{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;background:transparent}
.task.done p{text-decoration:line-through;color:var(--muted)}
.task p{margin:0;font-size:14px;line-height:1.35}
.task p small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.task .kind{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.task.gym{border-style:solid;background:var(--basil-soft);border-color:transparent}
.task.gym .kind{color:var(--basil)}
.task.link{cursor:pointer}
.nowline{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;margin:-2px 0 8px}
.nowline span{font-family:var(--f-mono);font-size:11.5px;color:var(--tomato);text-align:right;font-weight:500}
.nowline i{height:2px;background:var(--tomato);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--tomato)}

/* Water */
.water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glasses{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.glass{width:18px;height:24px;border:2px solid var(--line);border-radius:3px 3px 6px 6px;position:relative;overflow:hidden}
.glass.full{border-color:var(--basil)}
.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72%;background:var(--basil);opacity:.55}

/* Plan */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.focus{display:grid;gap:0}
.focus .fi{display:grid;grid-template-columns:1fr;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.focus .fi:first-of-type{border-top:0}
.focus .fi b{font-size:14.5px}
.focus .fi p{margin:0;font-size:13.5px;color:var(--muted)}
.list-check ul{list-style:none;margin:0;padding:0}
.list-check li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.list-check li:first-child{border-top:0}
.list-check li.done p{text-decoration:line-through;color:var(--muted)}
.list-check p{margin:2px 0 0}
.wday{padding:4px 0}
.wday-h{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px;flex-wrap:wrap}
.wday-h h3{font-size:17px}
.wday-h .k{margin-left:auto}
.wrow{display:grid;grid-template-columns:84px 1fr auto auto;gap:8px;align-items:center;padding:7px 6px 7px 14px;border-top:1px solid var(--line)}
.wrow .slot{font-size:10px;letter-spacing:.05em}
.wrow button.nm{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;min-width:0}
.wrow .k{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}

/* Shop receipt */
.stores{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.stores .chip{flex:none}
.receipt{position:relative;background:var(--card);margin:14px 0 0;padding:22px 18px;font-family:var(--f-mono);font-size:13px;filter:drop-shadow(0 2px 6px rgba(21,33,26,.08))}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--card) 0) 0 0/14px 14px repeat-x,linear-gradient(45deg,transparent 7px,var(--card) 0) 0 0/14px 14px repeat-x}
.receipt::before{top:-9px;transform:scaleY(-1)}
.receipt::after{bottom:-9px}
.rc-head{text-align:center;border-bottom:1px dashed var(--muted);padding-bottom:12px}
.rc-head .t{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:.02em}
.rc-head div{color:var(--muted);font-size:12px}
.aisle{margin-top:16px}
.aisle h4{margin:0 0 4px;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:7px 0;border-top:1px dotted var(--line)}
.gi .check{width:22px;height:22px;border-width:1.5px;margin-top:1px}
.gi .check svg{width:12px;height:12px}
.gi .nm{font-family:var(--f-body);font-size:14.5px;font-weight:600;line-height:1.3}
.gi .sub{color:var(--muted);font-size:12px;margin-top:2px}
.gi .sub a{font-family:var(--f-body);font-weight:600;font-size:12px;text-decoration:none;white-space:nowrap}
.gi .pr{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gi.got .nm{text-decoration:line-through;color:var(--muted)}
.rc-tot{border-top:1px dashed var(--muted);margin-top:16px;padding-top:12px;display:grid;gap:4px}
.rc-tot div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.rc-tot .g{font-size:16px;font-weight:500}
.copybox{width:100%;min-height:180px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);font-family:var(--f-mono);font-size:12px}

/* Progress */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--basil);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--basil);opacity:.10}
.chart .dot{fill:var(--basil);stroke:var(--card);stroke-width:2}
.chart .band{fill:var(--basil);opacity:.08}
.chart .barm{fill:var(--basil)}
.chart .barm.low{fill:var(--citrus-bar)}
.chart .barm.none{fill:var(--line)}
.chart .hit{fill:transparent;cursor:pointer}
.ctip{position:fixed;z-index:70;background:var(--ink);color:var(--paper);font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rc li:first-child{border-top:0}
.rc ul{list-style:none;margin:0;padding:0}
.rc p{margin:0;font-size:14px}
.rc .st{margin-top:2px}

/* Settings */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input[type=text],input[type=number],input[type=password],input[type=url],input[type=time],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-width:0;min-height:44px}
input:focus,select:focus{outline:2px solid var(--basil);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.target{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:14px 16px}
.target b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.target b small{font-size:14px;font-weight:600;opacity:.75;margin-left:3px}
.target p{margin:0;font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--basil);margin-top:2px;flex:none}
.concern{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:var(--card)}
.concern input{accent-color:var(--basil);width:20px;height:20px;margin-top:1px}
.concern b{font-size:14.5px}
.concern p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.concern.on{border-color:var(--basil);background:var(--basil-soft)}
.cgrid{display:grid;gap:8px}
.lab{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center}
.lab .n{font-size:14px;font-weight:600;min-width:0}
.lab .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prov{display:grid;gap:8px}
.pv{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.pv input{accent-color:var(--basil);width:18px;height:18px;margin-top:2px}
.pv .n{font-weight:700}
.pv .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.pv.on{border-color:var(--basil);background:var(--basil-soft)}
.pv.off{opacity:.6}
.pvcfg{grid-column:1/-1;display:grid;gap:10px;margin-top:6px;cursor:auto}
.sect-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--ink)}
.busy{display:flex;gap:12px;align-items:center}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--basil);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,16,12,.45);display:flex;justify-content:center;align-items:flex-end}
.sheet-in{background:var(--paper);width:100%;max-width:680px;max-height:100%;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;z-index:2}
.sheet-bar .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.rstats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.rstats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.rstats b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.rstats span{font-size:11px;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ing li:first-child{border-top:0}
.ing li.got span{color:var(--muted);text-decoration:line-through}
.stepl{margin:0;padding:0;list-style:none;counter-reset:st}
.stepl li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0}
.stepl li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700}
.cook{min-height:60vh;display:flex;flex-direction:column}
.cook .big{font-family:var(--f-display);font-size:clamp(22px,5.6vw,30px);font-weight:600;line-height:1.3;margin:18px 0;flex:1}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--basil)}
.timer{display:flex;align-items:center;gap:12px;background:var(--citrus-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.timer b{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-family:var(--f-mono);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;padding:40px 20px}
.mob li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mob li:first-child{border-top:0}
.mob ul{list-style:none;margin:0;padding:0}
@media (min-width:700px){
  .sheet{align-items:center;padding:24px}
  .sheet-in{border-radius:20px;max-height:92vh}
  .sheet-bar .grab{display:none}
}
@media (max-width:420px){
  .dash{grid-template-columns:1fr;justify-items:center}
  .bars{width:100%}
  .three{grid-template-columns:1fr 1fr}
  .rstats b{font-size:15px}
  .rstats span{font-size:10px}
  .stat b{font-size:19px}
  .ti{grid-template-columns:52px 1fr;gap:8px}
  .nowline{grid-template-columns:52px 1fr;gap:8px}
  .lab{grid-template-columns:1fr 96px}
  .lab .pill{grid-column:1/-1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Header gear */
.gear{background:none;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none;margin-left:4px}
.gear svg{width:19px;height:19px}
.gear[aria-current="page"]{color:var(--basil);border-color:var(--basil);background:var(--basil-soft)}

/* Eat Out */
.range{width:100%;accent-color:var(--basil);min-height:32px}
.eomap-wrap{position:relative}
.eomap{height:340px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--soft);z-index:0}
.eomap-note{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--card);color:var(--muted);font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.leaflet-container{font-family:var(--f-body);background:var(--soft)}
.leaflet-control-attribution{font-size:10px}
.pin{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 6px;border-radius:13px 13px 13px 3px;font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap}
.pin.hi{background:#2a7749}
.pin.mid{background:#b87f05}
.pin.lo{background:#7a837d}
.you-dot{display:block;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.2)}
.eolist{display:grid;gap:8px}
.eorow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 12px;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.eo-main{display:grid;gap:2px;min-width:0}
.eo-main b{font-size:15.5px;font-weight:600;line-height:1.25}
.eo-why{color:var(--muted)}
.score{display:inline-grid;place-items:center;min-width:46px;height:40px;padding:0 6px;border-radius:10px;font:500 17px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.score.hi{background:var(--basil);color:var(--basil-ink)}
.score.mid{background:var(--citrus-soft);color:var(--citrus)}
.score.lo{background:var(--soft);color:var(--muted)}
.score.big{min-width:62px;height:52px;font-size:24px;border-radius:12px}
.pbars .bar-row{grid-template-columns:128px 1fr auto}
.pdot{display:block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pdot.hi{background:#2a7749}.pdot.mid{background:#b87f05}.pdot.lo{background:#7a837d}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6)}

/* ===== Redesign (Oct 17): light, rich, simple ===== */
body{font-size:15.5px}
.wrap{padding-block:calc(14px + env(safe-area-inset-top,0px)) 120px}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.btn{min-height:46px;border-radius:14px;padding:10px 16px;font-weight:700;border-color:var(--line)}
.btn.sm{min-height:34px;border-radius:10px;padding:6px 12px;font-weight:600}
.btn.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--basil) 30%,transparent)}
.btn.big{min-height:56px;border-radius:18px;font-size:17px}
.h3{font-family:var(--f-display);font-size:17px;font-weight:600}
.chip{border-radius:12px;min-height:40px}
.linkbtn{background:none;border:0;color:var(--basil);font-weight:700;font-size:14px;padding:8px;cursor:pointer}
.tabs{background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs-in{grid-template-columns:repeat(4,1fr)}
.tabs button{font-size:12px;padding:10px 2px 8px;font-weight:600}
.tabs button[aria-current="page"]{font-weight:800}
body.wizard .tabs{display:none}

.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pdate{font-size:13px;font-weight:600;color:var(--muted)}
.pgreet{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--basil-soft);color:var(--basil);display:grid;place-items:center;cursor:pointer;flex:none}
.avatar svg{width:22px;height:22px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--citrus-soft);color:var(--ink);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;margin-bottom:10px}
.viewing{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sky-soft);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
.sect-label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}

.hero{background:var(--card);border-radius:24px;padding:16px;display:grid;gap:14px;box-shadow:var(--lift)}
.hero-top{display:flex;gap:14px;align-items:center;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;width:100%}
.plate{flex:none}
.hero-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--basil)}
.hero-n{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.hero-m{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero-lo{font-size:12.5px;font-weight:700;color:var(--citrus)}
.hero-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-acts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero-acts .btn{padding-inline:6px}
.hero.done-all{gap:4px}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.ringc{background:var(--card);border-radius:20px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);min-width:0}
.ringc svg{flex:none}
.ringc b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600}
.ringc span{font-size:12.5px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;border:0;min-height:36px}
.bchip.ok{background:var(--basil-soft);color:var(--basil)}
.bchip.warn{background:var(--citrus-soft);color:var(--citrus)}
.bchip.water{background:var(--sky-soft);color:var(--sky);cursor:pointer}
.bchip.water b{font-size:15px}
.list{padding:4px 16px 6px;margin-top:14px}
.list-h{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.lrow{display:grid;grid-template-columns:auto 68px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft)}
.lrow .check{margin:0}
.lt{font-size:12.5px;font-weight:700;color:var(--muted)}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left;min-width:0;cursor:pointer;font:inherit}
span.ln{cursor:default}
.lname{font-weight:600;font-size:15px;min-width:0}
.ltag{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.ltag.k-meal{color:var(--basil)}
.ltag.k-gym{color:var(--sky)}
.ltag.k-thaw,.ltag.k-pack,.ltag.k-prep,.ltag.k-prepday{color:var(--citrus)}
.lrow.done .lname{text-decoration:line-through;color:var(--muted)}
.lrow.past:not(.done){opacity:.75}

details.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
details.acc > summary{list-style:none;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;padding:15px 16px;cursor:pointer;align-items:center}
details.acc > summary::-webkit-details-marker{display:none}
.acc-t{font-weight:800;font-size:15.5px}
.acc-s{grid-column:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.acc .chev{grid-row:1/span 2;grid-column:2;width:20px;height:20px;color:var(--muted);transition:transform .2s}
details.acc[open] .chev{transform:rotate(180deg)}
.acc-b{padding:0 16px 16px;display:grid;gap:14px}
.acc-b > .section{margin-top:0}

.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:14px;padding:4px;margin-bottom:6px}
.seg.big button{border-radius:11px;padding:10px;font-size:14.5px}
.days-list{display:grid;gap:10px}
.dayc{padding:4px 14px 6px}
.dayc.today{box-shadow:0 0 0 2px var(--basil),var(--shadow)}
.dayc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;width:100%;background:none;border:0;padding:10px 0 6px;color:inherit;text-align:left;cursor:pointer;font:inherit}
.drow{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;border-top:1px solid var(--soft);padding:4px 0}
.dslot{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--basil)}
.dn{background:none;border:0;padding:6px 0;text-align:left;color:inherit;font:inherit;font-weight:600;cursor:pointer;min-width:0}

.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.theme{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:700}
.theme .sw{width:54px;height:54px;border-radius:16px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:8px;border:2px solid var(--line);box-sizing:border-box}
.theme .sw i{display:block;width:14px;height:14px;border-radius:50%}
.theme.on .sw{border-color:var(--basil);box-shadow:0 0 0 3px var(--basil-soft)}
.wiz{min-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.wiz-top{display:flex;align-items:center;gap:12px}
.iconbtn.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.iconbtn.round svg{width:20px;height:20px}
.wiz-prog{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.wiz-prog i{height:6px;border-radius:3px;background:var(--line)}
.wiz-prog i.on{background:var(--basil)}
.wiz-h{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:8px 0 0}
.wiz-p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.wiz .themes{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.wiz .theme .sw{width:84px;height:84px;border-radius:22px}
.wiz .theme .sw i{width:18px;height:18px}
.wiz-foot{margin-top:auto;padding-top:10px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.one{grid-template-columns:1fr}
.tile{min-height:76px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink);cursor:pointer;font:inherit}
.tile b{font-size:15.5px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.on{border:2px solid var(--basil);background:var(--basil-soft);padding:11px 13px}

/* Eat Out */
body.on-eatout .wrap{padding-top:0}
.eo-hero{position:relative;margin-inline:-16px;height:min(56vh,480px);min-height:340px}
.eomap-slot{position:absolute;inset:0;background:var(--map)}
.eomap{position:absolute;inset:0;height:auto;border:0;border-radius:0;background:var(--map)}
.eo-float{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:600;display:grid;gap:10px;pointer-events:none}
.eo-float > *{pointer-events:auto}
.eo-search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border-radius:18px;background:var(--card);box-shadow:0 6px 22px rgba(27,36,32,.16);color:var(--muted)}
.eo-q{flex:1;font-weight:700;color:var(--ink);font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eo-fbtn{height:40px;padding:0 12px;border-radius:12px;border:0;background:var(--basil-soft);color:var(--basil);font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.eo-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.eo-chips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:38px;padding:0 15px;border-radius:999px;border:0;background:var(--card);color:var(--ink);font-weight:700;font-size:13.5px;box-shadow:0 2px 10px rgba(27,36,32,.12);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--basil);color:var(--basil-ink)}
.eo-sheet{position:relative;z-index:5;margin:-26px -16px 0;padding:8px 16px 0;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(27,36,32,.10);display:grid;gap:12px}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin-bottom:2px}
.eomap-note{position:absolute;left:16px;bottom:38px;z-index:600;background:var(--card);color:var(--muted);font-size:12px;font-weight:600;padding:5px 10px;border-radius:10px;box-shadow:var(--shadow)}
.best{padding:16px;display:grid;gap:12px;box-shadow:var(--lift)}
.best-top{display:flex;gap:12px;align-items:center;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;width:100%}
.best-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.best-n{font-family:var(--f-display);font-size:19px;font-weight:600}
.best-order{margin:0;font-size:14px;line-height:1.5}
.sbig{flex:none;width:58px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sbig b{font-family:var(--f-display);font-size:21px;font-weight:700}
.sbig i{font-style:normal;font-size:10px;font-weight:700;opacity:.8;margin-top:3px}
.sbig.hi{background:var(--basil);color:var(--basil-ink)}
.sbig.mid{background:var(--citrus-soft);color:var(--citrus)}
.sbig.lo{background:var(--soft);color:var(--muted)}
.eolist{display:grid;gap:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:2px 12px}
.eorow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--soft);background:none;text-align:left;color:var(--ink);cursor:pointer;width:100%;border-radius:0;box-shadow:none;font:inherit}
.eorow:last-child{border-bottom:0}
.chevr{width:18px;height:18px;color:var(--muted)}
.score{font-family:var(--f-display);font-size:15px;font-weight:700;min-width:46px;height:38px;border-radius:12px}
.score.hi{background:var(--basil-soft);color:var(--basil)}
.pin{font-family:var(--f-display);font-size:13.5px;font-weight:700;height:30px;min-width:44px;border-radius:14px 14px 14px 4px;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.pin.hi{background:var(--basil)}
.pin.mid{background:#C98420}
.pin.lo{background:#8A938D}
.pdot.hi{background:var(--basil)}
.gpin{position:absolute}
.gpin.a-pin{transform:translate(-50%,-100%)}
.gpin.a-center{transform:translate(-50%,-50%)}
.gpin > .pin{display:inline-flex}
.tiles-soft{filter:saturate(.75) brightness(1.03)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent)!important;color:var(--muted)!important}
.eo-filters{gap:12px}
.sheet-in{background:var(--paper)}
.receipt{border-radius:6px}
@media (min-width:700px){ .eo-hero{border-radius:0 0 24px 24px;overflow:hidden} }
@media (max-width:370px){ .hero-acts{grid-template-columns:1fr 1fr} .hero-acts .btn:first-child{grid-column:1/-1} .themes{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* ===== Merged logging, chat, rewards ===== */
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:20px;border:0;background:var(--basil);color:var(--basil-ink);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--basil) 45%,transparent);cursor:pointer}
.fab svg{width:26px;height:26px}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addt{min-height:96px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:var(--ink);cursor:pointer;font:inherit}
.addt b{font-family:var(--f-display);font-size:17px}
.addt span{font-size:12.5px;color:var(--muted)}
.seg.big.four{grid-template-columns:repeat(4,1fr);margin:12px 0}
.seg.big.four button{padding:9px 2px;font-size:13px}
.ta{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font:inherit;resize:vertical;min-height:84px}
.ta:focus{outline:2px solid var(--basil);border-color:transparent}
.sheet-in .form, .sheet-in > .field{margin-top:10px}
.sheet-in .row{margin-top:10px}
.srch{display:grid;gap:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.srch:empty{display:none}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--soft);background:none;text-align:left;color:var(--ink);cursor:pointer;font:inherit;font-weight:600}
.srow:last-child{border-bottom:0}
.srow small{font-weight:500;color:var(--muted)}
.qr{width:100%;min-height:10px;border-radius:16px;overflow:hidden;background:var(--soft);margin-top:10px}
.qr:empty{display:none}
.pend{margin-top:14px;display:grid;gap:10px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;border-top:1px solid var(--soft);padding-top:8px}
.pn{display:flex;flex-direction:column;min-width:0}
.pm{display:flex;align-items:center;gap:2px}
.pm .num{min-width:36px;text-align:center;font-weight:700;font-size:14px}
.pk{grid-column:1/-1}
.note.ok{background:var(--basil-soft)}
.chatlist{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;margin:12px 0;padding:2px}
.bubble{max-width:85%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45}
.bubble.user{align-self:flex-end;background:var(--basil);color:var(--basil-ink);border-bottom-right-radius:5px}
.bubble.assistant{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.chatin{display:flex;gap:8px}
.chatin input{flex:1}
.rew{display:grid;gap:10px}
.lvl{font-family:var(--f-display);font-size:19px}
.xpbar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--basil),var(--prot))}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--soft);opacity:.55}
.badge.on{opacity:1;background:var(--basil-soft)}
.badge .bdg{font-size:20px;line-height:1;color:var(--prot)}
.badge b{font-size:11.5px;line-height:1.2}
.badge span:last-child{display:none}
.askcard{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:12px;text-align:left;color:var(--ink);border:0;cursor:pointer;font:inherit}
.askcard > span{display:flex;flex-direction:column;gap:2px}
.logdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--prot-soft);color:var(--prot);font-weight:800;font-size:15px}
.logdot.move{background:var(--sky-soft);color:var(--sky)}
.list-sub{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px;border-top:1px solid var(--soft)}
pre.code{background:var(--soft);border-radius:10px;padding:10px;font-family:var(--f-mono);font-size:11.5px;overflow-x:auto;white-space:pre;margin:6px 0}
.acc-b input[type=file]{font-size:13px;max-width:100%}
/* voice logging */
.vbox{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.vbox.on{border-color:var(--tomato);background:var(--tomato-soft)}
.vmic{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--basil);color:var(--basil-ink,#fff);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.vmic:disabled{opacity:.5}
.vmic.on{background:var(--tomato);color:#fff;animation:vpulse 1.4s ease-out infinite}
@keyframes vpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tomato) 45%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.vmeta{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.vmeta b{font-size:15px}
.vlevel{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.vlevel i{display:block;height:100%;width:0;background:var(--tomato);transition:width .08s linear}
.warnc{color:var(--tomato);font-weight:700}
@media (prefers-reduced-motion:reduce){.vmic.on{animation:none}}
/* my meals, proteins, nutrient check */
.chip.nope[aria-pressed="true"]{background:var(--tomato-soft);border-color:var(--tomato);color:var(--tomato)}
.mylist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.myrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.myrow:first-child{border-top:0}
.myrow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.myrow>div b{font-size:15px;line-height:1.25}
.myrow.off>div{opacity:.5;text-decoration:line-through}
.iconbtn.heart{font-size:20px;color:var(--tomato)}
.npills{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-bottom:10px}
.npill{display:flex;flex-direction:column;padding:7px 9px;border-radius:10px;font-size:12px;line-height:1.2;border:1px solid var(--line);background:var(--card)}
.npill b{font-family:var(--f-mono);font-size:15px}
.npill.ok b{color:var(--basil)}
.npill.mid{background:var(--citrus-soft)}
.npill.low{background:var(--tomato-soft)}.npill.low b{color:var(--tomato)}
.favm{color:var(--tomato);font-size:.9em}

const fmtD = (d,o) => d.toLocaleDateString('en-US', o);
const todayKey = () => ymd(new Date());
function planIndexOf(key){ if (!S.plan) return -1; for (let i=0;i<7;i++) if (ymd(dayDate(S.plan,i)) === key) return i; return -1; }
const toMin = s => { const [h,m] = String(s||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
function fmtTime(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; let h = Math.floor(m/60); const mm = m % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h+':'+String(mm).padStart(2,'0')+' '+ap; }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- planner ---------- */
function fitDay(day, T, Pt, share, plan, locked){
  const ms = Object.keys(day).map(sl => ({sl, m:day[sl], r:getR(day[sl].rid, plan)})).filter(x => x.r && x.r.cal > 0);
  const lk = x => !!(locked && locked.has(x.sl));
  ms.forEach(x => { if (!lk(x)) x.m.s = clamp(q25(T*share[x.sl]/x.r.cal), .5, 3); });
  const obj = () => {
    let cal = 0, p = 0, pen = 0;
    for (const x of ms){ const s = x.m.s; cal += x.r.cal*s; p += x.r.p*s; if (s < .75) pen += (.75-s)*8; if (s > 2) pen += (s-2)*6; if ((x.sl === 'snack' || x.sl === 'evening') && s > 1.5) pen += (s-1.5)*12; pen += Math.abs(x.r.cal*s/T - share[x.sl])*12; }
    return Math.abs(cal - T)/T*300 + Math.max(0, Pt - p)/Pt*200 + Math.max(0, p - Pt*1.25)/Pt*60 + pen;
  };

  for (let it = 0; it < 60; it++){
    let best = null, bestV = cur;
    for (let i = 0; i < ms.length; i++){
      if (lk(ms[i])) continue;
      const s0 = ms[i].m.s;
      for (const d of [.25, -.25]){ const s1 = s0 + d; if (s1 < .5 || s1 > 3) continue; ms[i].m.s = s1; const v = obj(); if (v < bestV - 1e-9){ bestV = v; best = [[i,s1]]; } ms[i].m.s = s0; }
      for (let j = 0; j < ms.length; j++){
        if (i === j || lk(ms[j])) continue; const b0 = ms[j].m.s; if (s0 + .25 > 3 || b0 - .25 < .5) continue;
        ms[i].m.s = s0 + .25; ms[j].m.s = b0 - .25; const v = obj(); if (v < bestV - 1e-9){ bestV = v; best = [[i, s0+.25],[j, b0-.25]]; } ms[i].m.s = s0; ms[j].m.s = b0;
      }
    }
    if (!best) break; best.forEach(([i,s]) => ms[i].m.s = s); cur = bestV;
  }

}
function weekTotals(plan){
  const tot = Z(); plan.days.forEach(day => plan.slots.forEach(sl => { const m = day[sl]; if (!m) return; const r = getR(m.rid, plan); if (!r) return; for (let i=0;i<11;i++) tot[i] += r.n[i]*m.s; }));
  return tot.map(x => x/7);
}
function dayTotalsPlan(day, plan){ const t = Z(); plan.slots.forEach(sl => { const m = day[sl]; if (!m) return; const r = getR(m.rid, plan); if (!r) return; for (let i=0;i<11;i++) t[i] += r.n[i]*m.s; }); return t; }
function settingsSig(){ return JSON.stringify([targetInfo().target, targetInfo().protein, S.concerns, S.prefs, S.sched.gymDays, (S.myMeals || []).map(m => [m.id, m.updated, m.freq]), (S.mealPrefs || {}).fav || {}]); }
function planFrame(){
  const ti = targetInfo(); if (!ti.ok) throw new Error(ti.msg);
  const tg = nutTargets(ti), slots = slotsFor(+S.prefs.meals || 4), share = SHARES[slots.length];
  const start = planStart();
  const gym = []; for (let i=0;i<7;i++) gym.push(S.sched.gymDays.includes(dayDate({start}, i).getDay()));
  const g = gym.filter(Boolean).length, bonus = (g > 0 && g < 7) ? 150 : 0, minus = bonus ? Math.round(bonus*g/(7-g)) : 0;
  const dayT = gym.map(x => Math.round((ti.target + (x ? bonus : -minus))/10)*10);
  return {ti, tg, slots, share, start, gym, dayT, gymBonus:bonus};
}
function buildPlan(seed){
  const F = planFrame(), ctx = planCtx(), P = pools(ctx);
  ['breakfast','lunch','dinner','snack'].forEach(sl => { if (!P[sl].length) throw new Error('No built-in '+sl+' recipes fit your diet, dairy setting and “foods to avoid”. Loosen one of those, or plan with an AI model.'); });
  const rng = mulberry32(seed), W = nutWeights(), lean = S.prefs.variety !== 'more';
  const K = lean ? {breakfast:3,lunch:3,dinner:4,snack:3,evening:2,pre:2} : {breakfast:5,lunch:5,dinner:7,snack:5,evening:4,pre:3};
  const sh = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  const want = favTargets(), lov = protSet('love'), wOf = r => (want[r.id] ? 6 : 1) * (lov.size && lov.has(mainProt(r)) ? 5 : 1);
  const pick = (pool, k) => {
    const forced = pool.filter(r => want[r.id] && rng() < (want[r.id] >= 3 ? 0.8 : 0.5)).slice(0, k);
    const rest = pool.filter(r => !forced.includes(r)).map(r => [Math.pow(rng(), 1/wOf(r)), r]).sort((a,b) => b[0] - a[0]).map(x => x[1]);
    return forced.concat(rest).slice(0, Math.min(k, pool.length));
  };
  const seq = (set, twice) => { const out = []; let guard = 0; while (out.length < 7 && guard++ < 50){ for (const r of sh(set)){ if (out.length >= 7) break; if (out.length && out[out.length-1].id === r.id && set.length > 1) continue; out.push(r); if (twice(r) && out.length < 7) out.push(r); } } return out; };
  let best = null;
  const N = 140;
  for (let it = 0; it < N; it++){
    const Bs = pick(P.breakfast, K.breakfast), Ls = pick(P.lunch, K.lunch), Ds = pick(P.dinner, K.dinner), Ss = pick(P.snack, K.snack), Es = pick(P.evening, K.evening), Ps = pick(P.pre.length ? P.pre : P.snack, K.pre);
    const prep = prepOn();
    let B = seq(Bs, r => !!r.ahead), D = seq(Ds, () => false), L = seq(Ls, r => !!r.batch); const Sn = seq(Ss, () => false), E = seq(Es, () => false), Pr = seq(Ps, () => false);
    if (prep){ const pl = prepSeq(Ls, prepN('prepL'), []); L = pl.seq; D = prepSeq(Ds, prepN('prepD'), pl.chosen).seq; }
    const plan = {slots:F.slots, recipes:{}, days:[]};
    let objSum = 0;
    for (let d = 0; d < 7; d++){
      const day = {};
      day.breakfast = {rid:B[d].id, s:1};
      if (S.prefs.leftovers && !prep && d > 0) day.lunch = {rid:D[d-1].id, s:1, lo:true};
      else { let lr = L[d]; if (lr.id === D[d].id){ lr = Ls.find(x => x.id !== D[d].id) || lr; } day.lunch = {rid:lr.id, s:1}; }
      day.dinner = {rid:D[d].id, s:1};
      const sn = F.gym[d] ? Pr[d] : Sn[d]; day.snack = {rid:sn.id, s:1};
      if (F.slots.includes('evening')){ let er = E[d]; if (er.id === sn.id){ er = Es.find(x => x.id !== sn.id) || P.evening.find(x => x.id !== sn.id) || er; } day.evening = {rid:er.id, s:1}; }
      objSum += fitDay(day, F.dayT[d], F.tg.p, F.share, plan);
      plan.days.push(day);
    }
    if (prep){ prepNormalize(plan); objSum = 0; plan.days.forEach((day, d) => { objSum += fitDay(day, F.dayT[d], F.tg.p, F.share, plan, PLOCK); }); }
    const avg = weekTotals(plan);

    ['fib','o3','zn','fe','vd','mg','va'].forEach(k => { pen += (1 - Math.min(1, avg[NI(k)]/F.tg[k])) * (W[k]||1) * 30; });
    const keys = new Set(); let hgi = 0, fishMeals = 0;
    plan.days.forEach(day => F.slots.forEach(sl => { const r = getR(day[sl].rid); r.ing.forEach(([k]) => keys.add(k)); if (r.tags.has('hgi') || r.tags.has('sugar')) hgi++; if (r.n[5]*day[sl].s >= 400 && !day[sl].lo) fishMeals++; }));
    if (S.concerns.acne) pen += hgi * 2;
    if (ctx.cuisine === 'indian'){ let nonIn = 0; plan.days.forEach(day => ['breakfast','lunch','dinner'].forEach(sl => { if (day[sl] && getR(day[sl].rid).cuisine !== 'indian') nonIn++; })); pen += nonIn * 3; }
    else if (ctx.cuisine === 'mix'){ let inN = 0; plan.days.forEach(day => ['lunch','dinner'].forEach(sl => { if (day[sl] && getR(day[sl].rid).cuisine === 'indian') inN++; })); pen += Math.max(0, 4 - inN) * 2; }
    if (fishMeals > 4) pen += (fishMeals - 4) * 6;
    pen += prefPenalty(plan);
    pen += keys.size * (lean ? 1.2 : .3);
    const score = objSum + pen + rng()*0.5;
    if (!best || score < best.score) best = {score, plan};
  }
  return finalizePlan(Object.assign(best.plan, {id:Date.now().toString(36), engine:'builtin', engineName:'Built-in planner', start:F.start, target:F.ti.target, protein:F.tg.p, dayT:F.dayT, gym:F.gym, gymBonus:F.gymBonus, share:F.share, seed, sig:settingsSig(), created:Date.now()}));
}

/* ---------- a day: schedule, effective meals, timeline ---------- */
function dayInfo(d){
  const plan = S.plan, date = dayDate(plan, d), key = ymd(date), wd = date.getDay(), L = S.log[key] || {}, sc = S.sched;
  const work = sc.workDays.includes(wd) && !L.off;
  const wake = toMin(work ? sc.wake : sc.offWake); let bed = toMin(work ? sc.bed : sc.offBed); if (bed <= wake) bed += 1440;
  const gymPlanned = sc.gymDays.includes(wd);
  const gymOn = L.gym === 'skip' ? false : (gymPlanned || L.gym === 'on');
  return {date, key, wd, L, work, wake, bed, gymPlanned, gymOn, gymT:toMin(L.gymTime || sc.gymTime), gymDur:+sc.gymDur || 60, ws:toMin(sc.workStart), we:toMin(sc.workEnd) + (+L.late||0)*60};
}
function dayMeals(d){
  const plan = S.plan, day = plan.days[d], info = dayInfo(d), L = info.L;
  let T = plan.dayT[d];
  if (plan.gym[d] && !info.gymOn) T -= plan.gymBonus;
  if (!plan.gym[d] && info.gymOn) T += plan.gymBonus;
  const out = []; let fixed = 0, flex = 0;
  const extra = L.extra || [], burnK = (L.burn || []).reduce((a,b) => a + (+b.kcal||0), 0);
  T += Math.round(burnK*0.5);
  fixed += extra.reduce((a,x) => a + (x.n[0]||0), 0);
  plan.slots.forEach(sl => {
    const m = day[sl]; if (!m) return; const r = getR(m.rid); if (!r) return;
    const eo = (L.eatOut || {})[sl] || null, ea = (L.eaten || {})[sl] || null;
    out.push({slot:sl, rid:m.rid, r, s:m.s, lo:!!m.lo, eatOut:eo, eaten:ea});
    if (ea) fixed += ea.n[0]; else if (eo) fixed += +eo.kcal || 0; else flex += r.cal*m.s;
  });
  const changed = Object.keys(L.eatOut || {}).length > 0 || plan.gym[d] !== info.gymOn || extra.length > 0 || burnK > 0 || Object.values(L.eaten || {}).some(e => e.src === 'log');
  const f = (flex > 0 && changed) ? clamp((T - fixed)/flex, .6, 1.4) : 1;
  out.forEach(o => { o.sEff = o.eaten ? o.eaten.s : clamp(q25(o.s*f), .25, 4); });
  return {meals:out, T, info};
}
function mealTimes(info, slots){
  const {wake, bed, work, ws, we, gymOn, gymT, gymDur} = info, t = {}, lab = {};
  t.breakfast = wake + 30;
  t.lunch = work ? clamp(Math.round((ws + 240)/15)*15, 690, 840) : Math.max(750, wake + 210);
  t.snack = Math.max(t.lunch + 150, 930);
  t.dinner = work ? Math.max(1110, we + 60) : 1110;
  t.evening = bed - 90;
  if (gymOn){
    const G = gymT, E = G + gymDur;
    if (G < 660){ t.snack = Math.max(wake + 5, G - 45); lab.snack = 'Pre-gym snack'; t.breakfast = E + 30; lab.breakfast = 'Post-workout breakfast'; t.lunch = Math.max(t.lunch, t.breakfast + 180); }
    else if (G < 840){ t.snack = Math.max(t.breakfast + 120, G - 75); lab.snack = 'Pre-gym snack'; t.lunch = E + 30; lab.lunch = 'Post-workout lunch'; }
    else if (E + 30 <= bed - 150){ t.snack = Math.max(t.lunch + 90, G - 75); lab.snack = 'Pre-gym snack'; if (E + 30 > t.dinner - 30){ t.dinner = E + 30; } lab.dinner = 'Post-workout dinner'; }
    else { t.dinner = G - 120; lab.dinner = 'Dinner, before the gym'; if (slots.includes('evening')){ t.evening = E + 20; lab.evening = 'Post-workout protein'; t.snack = Math.min(t.snack, t.dinner - 150); } else { t.snack = E + 20; lab.snack = 'Post-workout snack'; } }
  }
  if (slots.includes('evening') && !lab.evening) t.evening = clamp(t.evening, t.dinner + 90, bed - 30);
  return {t, lab};
}
function fmtNeed(k, q){
  const c = C[k], us = S.profile.units === 'us';
  if (c.u === 'g'){ const g = Math.round(q/10)*10; return us ? (q >= 454 ? (q/453.6).toFixed(1)+' lb' : Math.round(q/28.35)+' oz') : (g >= 1000 ? (g/1000).toFixed(1)+' kg' : g+' g'); }
  if (c.u === 'ml') return us ? frac(q/240)+' '+plural(q/240,'cup','cups') : Math.round(q/10)*10+' ml';
  if (c.u === 'tbsp') return frac(q)+' tbsp';
  return frac(q)+' '+(q25(q) > 1 ? c.cn[1] : c.cn[0]);
}
/* Thaw tonight (evening of day e): tomorrow's breakfast, snacks and dinner, plus the lunch for the day after
   (that lunch gets cooked and packed tomorrow evening). Only meals from Wednesday on use frozen meat. */
function thawList(e){
  if (prepOn()) return [];
  const plan = S.plan, tot = {};
  const add = (d, sl) => { if (d < 2 || d > 6) return; const m = plan.days[d][sl]; if (!m || m.lo) return; const r = getR(m.rid); if (!r) return; let s = m.s;
    if (sl === 'dinner' && d < 6){ const nl = plan.days[d+1].lunch; if (nl && nl.lo && nl.rid === m.rid) s += nl.s; }
    if (sl === 'lunch' && d > 0 && plan.days[d-1].lunch && plan.days[d-1].lunch.rid === m.rid) return;
    if (sl === 'lunch'){ s = 0; for (let k = d, n = 0; k < 7 && n < 3; k++, n++){ const lm = plan.days[k].lunch; if (!lm || lm.lo || lm.rid !== m.rid) break; s += lm.s; } }
    r.ing.forEach(([k,q]) => { if (C[k] && C[k].freeze) tot[k] = (tot[k]||0) + q*s; }); };
  plan.slots.forEach(sl => { if (sl !== 'lunch') add(e+1, sl); });
  add(e+2, 'lunch');
  return Object.entries(tot).map(([k,q]) => fmtNeed(k,q)+' '+C[k].n.toLowerCase().replace(' (fresh or frozen)',''));
}
function timeline(d){
  const plan = S.plan, dm = dayMeals(d), info = dm.info, {t, lab} = mealTimes(info, plan.slots), items = [];
  dm.meals.forEach(m => items.push({kind:'meal', id:'m:'+m.slot, t:t[m.slot], label:lab[m.slot] || SLOTNAME[m.slot], m}));
  if (info.gymOn) items.push({kind:'gym', id:'gym', t:info.gymT, title:'Gym', sub:info.gymDur+' minutes. Bring water.'});
  if (S.concerns.back) items.push({kind:'mobility', id:'mob', t:info.wake + 10, title:'5-minute back mobility', sub:'Tap for the routine'});
  if (d < 6){
    const tm = plan.days[d+1], next = dayInfo(d+1);
    const bR = tm.breakfast && getR(tm.breakfast.rid);
    if (bR && bR.ahead) items.push({kind:'prep', id:'oats', t:info.bed - 60, title:'Make tomorrow’s '+bR.name.toLowerCase(), sub:'5 minutes. It sets overnight in the fridge.'});
    const pth = prepOn() ? prepThawText(plan, d) : '';
    if (pth) items.push({kind:'thaw', id:'thaw', t:info.bed - 90, title:pth, sub:'It needs about 24 hours to thaw safely'});
    const th = thawList(d);
    if (th.length) items.push({kind:'thaw', id:'thaw', t:info.bed - 90, title:'Move '+th.join(' and ')+' from the freezer to the fridge', sub:'It needs about 24 hours to thaw safely'});
    if (next.work && tm.lunch && prepOn() && !tm.lunch.lo){
      items.push({kind:'pack', id:'pack', t:Math.max(info.bed - 120, 1230), title:'Pack tomorrow’s lunch box', sub:'It is already cooked. Take it from the fridge, nothing to make.'});
    } else if (next.work && tm.lunch){
      const lr = getR(tm.lunch.rid), today = plan.days[d].lunch, again = today && today.rid === tm.lunch.rid;
      let runS = 0, runN = 0; for (let k = d+1; k < 7 && runN < 3; k++){ const lm = plan.days[k].lunch; if (!lm || lm.lo || lm.rid !== tm.lunch.rid) break; runS += lm.s; runN++; }
      const title = tm.lunch.lo ? 'Pack leftovers of tonight’s dinner for lunch' : again ? 'Pack another portion of '+lr.name.toLowerCase()+' for lunch' : runN > 1 ? 'Make '+frac(runS)+' servings of '+lr.name.toLowerCase()+'. Pack one for tomorrow’s lunch and refrigerate the rest' : 'Make and pack tomorrow’s lunch: '+lr.name;
      items.push({kind:'pack', id:'pack', t:tm.lunch.lo || again ? info.bed - 45 : Math.max(info.bed - 150, (mealTimes(info, plan.slots).t.dinner || 1110) + 45), title, sub:tm.lunch.lo || again ? 'Use a sealed container and keep it in the fridge' : 'About '+lr.min+' minutes. Cook it alongside dinner if you can.'});
    }
  }
  if (d === 2 && !prepOn()){ const later = grainUse(plan, 3, 6); if (later.rice > 60 || later.quinoa > 60) items.push({kind:'prep', id:'grain', t:Math.max(info.bed - 180, 1170), title:'Cook '+[later.rice > 60 ? grainText('rice', later.rice) : '', later.quinoa > 60 ? grainText('quinoa', later.quinoa) : ''].filter(Boolean).join(' and '), sub:'For Thursday to Sunday. Cool it fast, then refrigerate.'}); }
  if (info.wd === +S.sched.prepDay) items.push({kind:'prepday', id:'prepday', t:toMin(S.sched.prepTime), title:d === 6 ? 'Plan and shop for next week' : 'Mid-week prep session', sub:d === 6 ? 'Make a new plan, then shop and prep.' : 'Tap to open the prep checklist'});
  items.sort((a,b) => a.t - b.t);
  return {items, info, dm};
}

/* ---------- logging and scores ---------- */
function L(key){ return S.log[key] = S.log[key] || {}; }
function dayEaten(key){ const t = Z(); const lg = S.log[key]; if (!lg) return t; Object.values(lg.eaten || {}).concat(lg.extra || []).forEach(e => { for (let i=0;i<11;i++) t[i] += e.n[i]||0; }); return t; }
function dayScore(key){
  const lg = S.log[key]; if (!lg || (!Object.keys(lg.eaten || {}).length && !(lg.extra || []).length)) return null;
  const ti = targetInfo(); if (!ti.ok) return null;
  const d = planIndexOf(key), T = d >= 0 ? dayMeals(d).T : ti.target, Pt = S.plan ? S.plan.protein : ti.protein;
  const e = dayEaten(key), nSlots = S.plan ? S.plan.slots.length : 4;
  const pP = 40*Math.min(1, e[1]/(Pt*0.95));
  const dev = Math.abs(e[0] - T)/T, pC = dev <= .1 ? 25 : dev >= .3 ? 0 : 25*(1 - (dev - .1)/.2);
  const pM = 15*Math.min(1, (Object.keys(lg.eaten || {}).length + Math.min(1, (lg.extra || []).length)*0.5)/nSlots);
  const gymDay = d >= 0 ? dayInfo(d).gymOn : false;
  const pW = 10*Math.min(1, (lg.water||0)/waterGoal(gymDay));
  let pT = 10;
  if (d >= 0){ const its = timeline(d).items.filter(i => i.kind !== 'meal'); if (its.length){ const done = its.filter(i => (lg.tasks||{})[i.id]).length; pT = 10*done/its.length; } }
  return {score:Math.round(pP + pC + pM + pW + pT), kcal:e[0], p:e[1], T, Pt, parts:{protein:pP, cal:pC, meals:pM, water:pW, tasks:pT}};
}
function streak(){ let n = 0; const d = new Date(); d.setDate(d.getDate()-1); for (let i=0;i<60;i++){ const s = dayScore(ymd(d)); if (!s || s.score < 70) break; n++; d.setDate(d.getDate()-1); } const t = dayScore(todayKey()); if (t && t.score >= 70) n++; return n; }

/* ---------- groceries and prep ---------- */
const AISLES = ['Produce','Meat & Seafood','Dairy & Eggs','Deli','Bakery','Frozen','Pantry','Other'];
function forEachMeal(plan, fn){ plan.days.forEach((day,d) => plan.slots.forEach(sl => { if (day[sl]) fn(day[sl], d, sl); })); }
function groceries(plan){
  const map = new Map(), spices = new Set();
  forEachMeal(plan, m => { const r = getR(m.rid, plan); if (!r) return; (r.spices||[]).forEach(x => spices.add(x)); r.ing.forEach(([k,q]) => { if (!C[k]) return; map.set(k, (map.get(k)||0) + q*m.s); }); });
  const rows = [];
  map.forEach((qty, k) => { const c = C[k], packs = Math.max(1, Math.ceil(qty/c.pk - 0.08)); rows.push({id:k, name:c.n, aisle:c.a, need:fmtNeed(k, qty), buy:c.custom ? 'as needed' : packs+' × '+c.pl, price:packs*c.pr, q:c.q, pantry:!!c.pantry}); });
  rows.sort((a,b) => AISLES.indexOf(a.aisle) - AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name));

  const ctx = planCtx(), P = pools(ctx), pool = (sl === 'evening' ? P.evening : P[poolSlot(sl)]).concat(Object.values(plan.recipes||{}).filter(r => r.slots.includes(poolSlot(sl))));
  const nope = (S.mealPrefs || {}).no || {};
  const uniq = pool.filter((r,i) => r.id !== cur.id && baseId(r.id) !== baseId(cur.id) && !String(r.id).includes('~') && !nope[baseId(r.id)] && pool.findIndex(x => x.id === r.id) === i && r.cal > 0);
  if (!uniq.length){ toast('No other recipes fit your settings for this meal.'); return; }
  const oldCal = cur.cal*m.s, oldP = cur.p*m.s;
  uniq.sort((a,b) => (b.p/b.cal) - (a.p/a.cal));
  plan.swapN = (plan.swapN||0) + 1;
  const cands = uniq.filter(r => r.p/r.cal*oldCal >= oldP*0.85); const list = cands.length ? cands : uniq;
  const nr = list[(plan.swapN + d) % list.length];
  const sw = (prepOn() && (sl === 'lunch' || sl === 'dinner') && !m.lo) ? runDays(plan, sl, d) : [d];
  sw.forEach(x => { plan.days[x][sl] = {rid:nr.id, s:clamp(q25(oldCal/nr.cal), .5, 3)}; const k2 = ymd(dayDate(plan, x)); if (S.log[k2] && S.log[k2].eaten) delete S.log[k2].eaten[sl]; });
  if (sl === 'dinner' && d < 6 && plan.days[d+1].lunch && plan.days[d+1].lunch.lo){ const ln = plan.days[d+1].lunch, lc = getR(ln.rid).cal*ln.s; plan.days[d+1].lunch = {rid:nr.id, s:clamp(q25(lc/nr.cal), .5, 3), lo:true}; }
  const key = ymd(dayDate(plan, d)); if (S.log[key] && S.log[key].eaten) delete S.log[key].eaten[sl];
  save(); render(); toast('Swapped in '+nr.name+(sw.length > 1 ? ' for all '+sw.length+' boxes.' : '.'));
}

function targetBox(ti){
  if (!ti.ok) return '<div class="note">'+esc(ti.msg)+'</div>';
  let h = '<div class="target"><b class="num">'+n0(ti.target)+'<small>kcal</small></b><p><b style="font-size:15px;font-family:var(--f-body)">'+ti.protein+' g protein a day</b><br>';
  h += ti.custom ? 'Your own number.' : 'Resting burn '+n0(ti.bmr)+' × activity = '+n0(ti.tdee)+' to maintain'+(ti.adj ? (ti.adj < 0 ? ' − ' : ' + ')+Math.abs(ti.adj)+' for your goal' : '')+'.';
  if (ti.calAdj) h += ' Check-in adjustment: '+(ti.calAdj > 0 ? '+' : '−')+Math.abs(ti.calAdj)+'.';
  if (ti.floored) h += ' Raised to '+n0(ti.floor)+', the usual safe minimum.';
  h += '</p></div>';
  if (ti.calAdj) h += '<button class="btn sm" style="margin-top:8px" data-act="caladj" data-v="reset">Remove the check-in adjustment</button>';
  return h;
}

/* ---------- sheets ---------- */
function openSheet(sh){ sheet = sh; gotIng = new Set(); renderSheet(); }
function closeSheet(){ if (typeof stopScan === 'function') stopScan(); if (typeof voiceAbort === 'function') voiceAbort(); if (recog){ try { recog.stop(); } catch(e){} recog = null; } sheet = null; const el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; releaseWake(); }
function sheetMeal(){
  const plan = S.plan, d = sheet.d, sl = sheet.sl, dm = dayMeals(d), o = dm.meals.find(x => x.slot === sl), r = o.r, m = plan.days[d][sl];
  let cookS = o.sEff, note = '';
  if (sl === 'dinner' && d < 6){ const nl = plan.days[d+1].lunch; if (nl && nl.lo && nl.rid === m.rid){ cookS = o.sEff + nl.s; note = 'Cook '+frac(cookS)+' servings: eat '+frac(o.sEff)+' tonight and pack '+frac(nl.s)+' for tomorrow’s lunch.'; } }
  const pn = prepNote(plan, d, sl); if (pn){ cookS = pn.cookS; note = pn.note; }
  if (m.lo) note = 'These are leftovers from '+fmtD(dayDate(plan, d-1),{weekday:'long'})+'’s dinner. Reheat until steaming hot all the way through.';
  return {plan, o, r, cookS, note};
}

    '<path d="M38 38 L38 12 A26 26 0 0 1 62 30 Z" fill="'+c[0]+'"/><path d="M38 38 L62 30 A26 26 0 0 1 50 61 Z" fill="'+c[1]+'"/><path d="M38 38 L50 61 A26 26 0 0 1 14 46 Z" fill="'+c[2]+'"/><path d="M38 38 L14 46 A26 26 0 0 1 38 12 Z" fill="'+c[3]+'"/><circle cx="38" cy="38" r="7" fill="var(--card)"/></svg>';
}
function ringSVG(frac, color, track, label){
  const C = 150.8, f = clamp(frac, 0, 1);
  return '<svg width="58" height="58" viewBox="0 0 58 58" role="img" aria-label="'+esc(label)+'"><circle cx="29" cy="29" r="24" fill="none" stroke="'+track+'" stroke-width="8"/><circle cx="29" cy="29" r="24" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-f)).toFixed(1)+'" transform="rotate(-90 29 29)"/></svg>';

function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function bodyChips(d, dm, info, lg){
  const c = S.concerns, pn = Z(), tg = nutTargets(targetInfo()), out = [];
  dm.meals.forEach(o => { if (o.eaten){ for (let i=0;i<11;i++) pn[i] += o.eaten.n[i]||0; } else if (!o.eatOut) for (let i=0;i<11;i++) pn[i] += o.r.n[i]*o.sEff; });
  const ok = (n, good, okText, badText) => out.push('<span class="bchip '+(good ? 'ok' : 'warn')+'">'+n+(good ? ' ✓' : ' · '+badText)+'</span>');
  if (c.dryskin || c.dryears) ok('Skin', pn[10] >= tg.va*0.8 && (pn[5] >= 250 || weekTotals(S.plan)[5] >= tg.o3), '', 'add fish');
  if (c.hair) ok('Hair', pn[1] >= S.plan.protein*0.95 && pn[6] >= tg.zn*0.8, '', 'more protein');

function focusLines(plan, avg){
  const tg = nutTargets(targetInfo()), c = S.concerns, pctOf = k => Math.round(avg[NI(k)]/tg[k]*100), lines = [];

  if (c.dryskin || c.dryears) lines.push(['Skin and ears', fish+' fish '+(fish === 1 ? 'meal' : 'meals')+' this week. Omega-3 at '+pctOf('o3')+'% and vitamin A at '+pctOf('va')+'% of your needs.']);
  if (c.hair) lines.push(['Hair', n0(avg[1])+' g protein a day. Zinc '+pctOf('zn')+'%, iron '+pctOf('fe')+'%.']);
  if (c.acne) lines.push(['Acne', 'No regular milk, slow carbs, zinc at '+pctOf('zn')+'%.']);
  if (c.back) lines.push(['Back', 'Magnesium at '+pctOf('mg')+'%, plus a 5-minute stretch each morning.']);
  if (c.gas) lines.push(['Gut', 'Every meal is low-gas.']);
  if (c.energy) lines.push(['Energy', 'Meals every 3 to 4 hours; iron at '+pctOf('fe')+'%.']);
  if (c.joints) lines.push(['Joints', 'Omega-3 at '+pctOf('o3')+'%.']);
  if (avg[5] < tg.o3*0.5) lines.push(['Omega-3 is low', 'Without fish, ask your doctor about an algae-based omega-3.']);
  return lines.length ? '<div class="focus">'+lines.map(([b,p]) => '<div class="fi"><b>'+esc(b)+'</b><p>'+esc(p)+'</p></div>').join('')+'</div>' : '<p class="small muted">Pick body concerns in Me → Body concerns.</p>';
}

    case 'mv-save': { const mv = MOVES.find(x => x[0] === (sheet.move || 'walk')), lg = L(todayKey()); lg.burn = (lg.burn || []).concat([{id:Date.now().toString(36), name:mv[1], min:+sheet.mins || 30, kcal:+a.dataset.k}]); save(); closeSheet(); render(); toast(mv[1]+' logged. +'+n0(+a.dataset.k/2)+' kcal added to today.'); break; }
    case 'mv-del': { const lg = L(todayKey()); lg.burn = (lg.burn || []).filter(x => x.id !== a.dataset.id); save(); render(); renderSheet(); break; }
    case 'hk-import': { const f = ($('#hk-file') || {}).files; if (!f || !f[0]){ toast('Choose your Apple Health export first.'); break; } S.hkMsg = 'Reading your export…'; render(); importHealth(f[0]).then(n => { S.hkMsg = 'Imported active calories for '+n+' days.'; save(); render(); }, err => { S.hkMsg = 'Import failed: '+err.message; render(); }); break; }
    case 'lab-read': { const f = ($('#lab-pdf') || {}).files; if (!f || !f[0]){ labMsg = {err:true, t:'Choose your lab report PDF first.'}; render(); break; } labBusy = true; labMsg = null; render(); readLabPDF(f[0]).then(() => { labBusy = false; labMsg = {t:'Done. Your results are filled in above, and the planner now uses them.'}; render(); }, err => { labBusy = false; labMsg = {err:true, t:err.message}; render(); }); break; }
    case 'chat-open': openSheet({kind:'chat'}); setTimeout(() => { const cl = document.querySelector('.chatlist'); if (cl) cl.scrollTop = cl.scrollHeight; }, 30); break;
    case 'chat-send': { e.preventDefault(); const i = $('#chat-in'); if (i && i.value.trim() && !sheet.busy){ const v = i.value.trim(); i.value = ''; sendChat(v); } break; }
    case 'chat-clear': S.chat = []; save(); renderSheet(); break;
    case 'fb-save': { try { S.fbConfig = parseFbConfig(($('#fb-cfg') || {}).value || ''); fbErr = ''; save(); fbInit().catch(err => { fbErr = err.message; render(); }); } catch(err){ fbErr = err.message; } render(); break; }
    case 'fb-reset': S.fbConfig = null; fb = null; fbErr = ''; save(); render(); break;
    case 'fb-google': fbGoogle(); break;
    case 'fb-email': fbEmail(false); break;
    case 'fb-create': fbEmail(true); break;
    case 'fb-sync': syncUp().then(() => { toast('Backed up.'); render(); }); break;
    case 'fb-out': fbSignOut(); break;
    case 'closesheet': closeSheet(); break;
    case 'ing': { const i = +a.dataset.i; gotIng.has(i) ? gotIng.delete(i) : gotIng.add(i); renderSheet(); break; }
    case 'cook': sheet.kind = 'cook'; sheet.step = 0; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(err){} requestWake(); renderSheet(); break;
    case 'recipe': sheet.kind = 'recipe'; renderSheet(); break;
    case 'nextstep': sheet.step++; renderSheet(); break;
    case 'prevstep': sheet.step = Math.max(0, sheet.step - 1); renderSheet(); break;
    case 'starttimer': { const r = sheetMeal().r; startTimer(+a.dataset.s, r.name+', step '+(sheet.step+1)); break; }
    case 'stoptimer': stopTimer(); break;
    case 'opentimer': if (timer && timer.ref){ sheet = {kind:'cook', d:timer.ref.d, sl:timer.ref.sl, step:0}; renderSheet(); } break;
    case 'finishcook': { const key = ymd(dayDate(S.plan, sheet.d)), lg = L(key), o = dayMeals(sheet.d).meals.find(x => x.slot === sheet.sl); lg.eaten = lg.eaten || {}; lg.eaten[sheet.sl] = {s:o.sEff, n:o.r.n.map(x => x*o.sEff), name:o.r.name}; save(); closeSheet(); render(); toast('Nice work. Logged as eaten.'); break; }
    default: if (typeof mineAct === 'function') mineAct(act, a);
  }
});

/* ---------- boot ---------- */
function boot(){
  if (!S.plan){ try { S.plan = buildPlan(20261006); } catch(e){} save(); }
  render();
}
boot();
setInterval(() => { if (S.tab === 'today' && !sheet && document.visibilityState === 'visible' && !document.activeElement.matches('input,select,textarea')) render(); }, 60000);
if (window.claude && typeof window.claude.use === 'function'){ window.claude.use('sample').then(ns => { sampleNS = ns || null; if (S.tab === 'settings') render(); }, () => { sampleNS = null; }); }
else sampleNS = null;
if (S.fbConfig && !IN_CLAUDE){ setTimeout(() => fbInit().catch(() => {}), 300); }
if ('serviceWorker' in navigator && location.protocol === 'https:' && !IN_CLAUDE){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
window.__fuelwell = {eoScore, eoExamples, S:() => S, normalizeAI, planFrame, buildPrompt, buildPlan, dayMeals, timeline, targetInfo, nutTargets, weekTotals, buildICS, dayTotalsPlan, RX, C, getR, prepRuns, prepBatchTasks, prepCookMin, swapMeal, groceries, prepTasks};
})();
